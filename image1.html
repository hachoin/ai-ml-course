<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Registration Form</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#ffffff;
    padding:30px;
    width:380px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    margin-bottom:20px;
    color:#333;
}

input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    outline:none;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    background:#0073b1;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#005f91;
}

#thankyou{
    display:none;
    font-size:18px;
    color:green;
    font-weight:600;
}
</style>

</head>

<body>

<div class="container">

<h2>Register Now</h2>

<form id="myForm" action="https://docs.google.com/forms/d/e/1FAIpQLSduEfnKqVDVXwpuh9lvfQGkL934JBJlM6GziXnT6NNqYzDYQA/formResponse" method="POST" target="hidden_iframe" onsubmit="submitted=true;">

<input type="text" name="entry.1795851255" placeholder="Full Name" required>

<input type="email" name="entry.1572640658" placeholder="Email" required>

<input type="tel" name="entry.85357022" placeholder="Phone Number" required>

<input type="tel" name="entry.1537635821" placeholder="WhatsApp Number" required>

<select name="entry.896692678" required>
    <option value="">Select Course</option>
    <option value="aiml">AI/ML</option>
</select>

<input type="text" name="entry.1768586726" placeholder="Country" required>

<input type="text" name="entry.1968396756" placeholder="City" required>

<input type="text" name="entry.996980086" placeholder="How did you hear about us?" required>

<button type="submit">Submit</button>

</form>

<div id="thankyou">✅ Thank you! Your response has been submitted.</div>

<iframe name="hidden_iframe" style="display:none;" onload="if(submitted){showThankYou();}"></iframe>

</div>

<script>
let submitted = false;

function showThankYou(){
    document.getElementById("myForm").style.display = "none";
    document.getElementById("thankyou").style.display = "block";
}
</script>

</body>
</html>
