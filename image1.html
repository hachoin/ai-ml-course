<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lead Registration</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#141e30,#243b55);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    background:#fff;
    padding:30px;
    width:380px;
    border-radius:15px;
    box-shadow:0 20px 40px rgba(0,0,0,0.3);
    text-align:center;
}

h2{
    margin-bottom:20px;
    color:#222;
}

input, select{
    width:100%;
    padding:12px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    background:#0073b1;
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#005f91;
}

#success{
    display:none;
    color:green;
    font-weight:600;
    margin-top:15px;
}

.whatsapp{
    margin-top:10px;
    font-size:14px;
}
</style>

</head>

<body>

<div class="container">

<h2>🚀 Register Now</h2>

<form id="leadForm">

<input name="entry.1795851255" placeholder="Full Name" required>

<input type="email" name="entry.1572640658" placeholder="Email" required>

<input name="entry.85357022" placeholder="Phone Number" required>

<input name="entry.1537635821" placeholder="WhatsApp Number" required>

<select name="entry.896692678" required>
    <option value="">Select Course</option>
    <option value="aiml">AI / ML</option>
</select>

<input name="entry.1768586726" placeholder="Country" required>

<input name="entry.1968396756" placeholder="City" required>

<input name="entry.996980086" placeholder="How did you hear about us?" required>

<button type="submit">Submit</button>

</form>

<div id="success">
    ✅ Thank you! We received your details.<br>
    📲 Our team will contact you on WhatsApp shortly.
</div>

<div class="whatsapp">
    Or message us directly: <br>
    <a href="https://wa.me/917324852499" target="_blank">Chat on WhatsApp</a>
</div>

</div>

<script>
document.getElementById("leadForm").addEventListener("submit", function(e){
    e.preventDefault();

    const form = this;
    const formData = new FormData(form);

    fetch("https://docs.google.com/forms/d/e/1FAIpQLSduEfnKqVDVXwpuh9lvfQGkL934JBJlM6GziXnT6NNqYzDYQA/formResponse", {
        method: "POST",
        mode: "no-cors",
        body: formData
    }).then(() => {
        document.getElementById("success").style.display = "block";
        form.reset();
    });
});
</script>

</body>
</html>
